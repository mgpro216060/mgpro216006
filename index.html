<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARAH DUVAL - Peintre en Bâtiment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0f2038; /* Bleu nuit professionnel */
      /* Motif splash / taches de peinture en arrière-plan */
      background-image: 
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(28, 52, 84, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #172a46 0%, #0a1628 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* CARTE PRINCIPALE */
    .card {
      width: 100%;
      max-width: 430px;
      padding: 40px 25px;
      border-radius: 28px;
      background-color: #ffffff;
      
      /* Ton image de coups de peinture */
      background-image: url('blanc.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    /* LOGO PEINTRE (ROULEAU + PINCEAU) */
    .logo-securite {
      width: 90px;
      height: 105px;
      margin: 0 auto 15px;
      display: block;
      filter: drop-shadow(0px 4px 8px rgba(15, 32, 56, 0.25));
    }

    /* TEXTES */
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #0f2038;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 16px;
      color: #334155;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    /* BOUTONS */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-cv {
      color: #ffffff;
      background: linear-gradient(180deg, #1e3a60 0%, #0f2038 100%);
      border: 1px solid #0a1628;
      box-shadow: 0 4px 12px rgba(15, 32, 56, 0.3);
    }

    .btn-contact {
      color: #0f2038;
      background: #ffffff;
      border: 2px solid #1e3a60;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* BADGES SUR UNE SEULE LIGNE */
    .tags {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(15, 32, 56, 0.12);
      font-size: 12px;
      font-weight: 600;
      color: #0f2038;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Logo Vectoriel Peintre (Rouleau & Pinceau) -->
    <div class="logo-securite">
      <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="paintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d5282" />
            <stop offset="50%" stop-color="#1e3a60" />
            <stop offset="100%" stop-color="#0f2038" />
          </linearGradient>
        </defs>
        
        <!-- Rouleau de peinture -->
        <rect x="25" y="15" width="50" height="20" rx="4" fill="none" stroke="url(#paintGrad)" stroke-width="4.5"/>
        <path d="M 75 25 H 83 V 48 H 53 V 62" fill="none" stroke="url(#paintGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="47" y="62" width="12" height="22" rx="3" fill="none" stroke="url(#paintGrad)" stroke-width="4"/>
        
        <!-- Pinceau croisé -->
        <path d="M 22 75 L 38 75 L 36 90 L 24 90 Z" fill="none" stroke="url(#paintGrad)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M 22 90 C 22 96, 38 96, 38 90" fill="none" stroke="url(#paintGrad)" stroke-width="3.5"/>
        <path d="M 27 95 L 27 110 A 3 3 0 0 0 33 110 L 33 95" fill="none" stroke="url(#paintGrad)" stroke-width="3.5"/>
      </svg>
    </div>

    <h1>MOURAD GHENAI</h1>
    <p class="subtitle">Peintre en Bâtiment</p>

     <div class="buttons">
      <!-- Lien vers ton CV -->
      <a href="CV.pdf" target="_blank" class="btn btn-cv">
        Voir mon CV 📄
      </a>

      <!-- Bouton Contact qui propose le choix -->
      <a href="tel:0646557967" class="btn btn-contact">
  Appeler 📞
</a>
<a href="mailto:ghenaimourad1@gmail.com" class="btn btn-contact">
  Envoyer un mail ✉️
</a>
    </div>

    <script>
      function choixContact(e) {
        e.preventDefault();
        const choix = confirm("Clique sur OK pour appeler, ou Annuler pour envoyer un e-mail.");
        if (choix) {
          window.location.href = "tel:0600000000"; // <-- Met ton numéro ici
        } else {
          window.location.href = "mailto:tonmail@gmail.com"; // <-- Met ton mail ici
        }
      }
    </script>

    <div class="tags">
      <span class="tag">Sérieux</span>
      <span class="tag">Ponctuel</span>
      <span class="tag">Motivé</span>
      <span class="tag">Discret</span>
    </div>
  </div>

</body>
</html>
